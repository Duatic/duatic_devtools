# Private rosdep mapping: ROS package name -> Debian package name.
#
# Duatic packages are not in the public rosdistro index, so a <depend> on one resolves to nothing
# without this file, and bloom does not treat an unresolved key as an error.
#
# One file per ROS distro: the Debian names embed the distro.
duatic_helper_msgs:
  ubuntu:
    noble: [ros-jazzy-duatic-helper-msgs]

duatic_helpers:
  ubuntu:
    noble: [ros-jazzy-duatic-helpers]
