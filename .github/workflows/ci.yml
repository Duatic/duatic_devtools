name: ci
# Checks the tooling in this repository still works. Each job is gated on the paths it covers, so a
# change to one part does not pay for the others.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Run every job regardless of which paths changed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One git diff, reused by every job below. Cheaper than a path filter per job, and it keeps the
  # gating rules in one place.
  changes:
    runs-on: ubuntu-latest
    outputs:
      builder: ${{ steps.filter.outputs.builder }}
      archive: ${{ steps.filter.outputs.archive }}
      tests: ${{ steps.filter.outputs.tests }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: filter
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$FULL" = "true" ] || [ "${{ github.event_name }}" != "pull_request" ]; then
              changed=$(git ls-files)
          else
              changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          fi
          echo "$changed" | awk '{ print "  " $0 }'

          has() { echo "$changed" | grep -qE "$1"; }
          {
              has '^packaging/(builder|tests)/'        && echo "builder=true" || echo "builder=false"
              has '^packaging/archive/'                && echo "archive=true" || echo "archive=false"
              has '^packaging/tests/'                  && echo "tests=true"   || echo "tests=false"
              has '\.sh$'                              && echo "shell=true"   || echo "shell=false"
          } >> "$GITHUB_OUTPUT"

  format:
    uses: Duatic/ci-workflows/.github/workflows/pre-commit.yml@v1
    with:
      runner: ubuntu-latest

  # Every script, every time one of them changes.
  lint:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          fail=0
          while read -r f; do
              bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      # Advisory, not gating.
      - name: Shellcheck
        continue-on-error: true
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  # The fixtures are generated and committed, so the generator and the tree have to agree.
  fixtures:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and compare
        run: |
          packaging/tests/make_fixtures.sh
          git diff --exit-code -- packaging/tests/fixtures \
            || { echo "::error::fixtures differ from make_fixtures.sh, commit the regenerated tree"; exit 1; }

  # A real bloom-generate and dpkg-buildpackage, producing a real .deb.
  builder:
    needs: changes
    if: needs.changes.outputs.builder == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Only the released distros: a .deb published against rolling goes stale on its own.
      matrix:
        include:
          - ros_distro: jazzy
            os_version: noble
          - ros_distro: kilted
            os_version: noble
    steps:
      - uses: actions/checkout@v4

      - name: Generate the rosdep mapping for ${{ matrix.ros_distro }}
        env:
          ROS_DISTROS: ${{ matrix.ros_distro }}
          OS_VERSION: ${{ matrix.os_version }}
        run: packaging/tests/make_fixtures.sh

      - name: Build a fixture into a .deb
        env:
          ROS_DISTRO_TARGET: ${{ matrix.ros_distro }}
          OS_VERSION: ${{ matrix.os_version }}
        run: |
          mkdir -p out
          docker run --rm -i \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e ROSDEP_YAML="/rosdep/duatic-fixtures-${ROS_DISTRO_TARGET}.yaml" \
            -e ROS_DISTRO="$ROS_DISTRO_TARGET" \
            -e OS_VERSION="$OS_VERSION" \
            -v "$PWD/packaging/tests/fixtures:/src" \
            -v "$PWD/packaging/builder:/builder" \
            -v "$PWD/packaging/tests/rosdep:/rosdep" \
            -v "$PWD/out:/out" \
            "ros:${ROS_DISTRO_TARGET}-ros-base" \
            /builder/build_pkg.sh duatic_fixture_core < /dev/null

      - name: The .deb exists and declares what it should
        env:
          ROS_DISTRO_TARGET: ${{ matrix.ros_distro }}
        run: |
          want="ros-${ROS_DISTRO_TARGET}-duatic-fixture-core"
          debs=( "out/${want}_"*.deb )
          deb="${debs[0]}"
          [ -e "$deb" ] || { echo "::error::no .deb produced for $ROS_DISTRO_TARGET"; exit 1; }
          echo "built $deb"
          dpkg-deb -f "$deb" Package Version Architecture Maintainer Duatic-Vcs-Commit
          [ "$(dpkg-deb -f "$deb" Package)" = "$want" ] \
            || { echo "::error::wrong package name, wanted $want"; exit 1; }
          # dpkg-gencontrol has to carry the XB- field into the binary package.
          [ -n "$(dpkg-deb -f "$deb" Duatic-Vcs-Commit)" ] \
            || { echo "::error::no Duatic-Vcs-Commit in the built package"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-deb-${{ matrix.ros_distro }}
          path: out/*.deb
          if-no-files-found: warn

  # publish_archives.sh needs aptly and a key, so the check is that it refuses to run without one.
  archive:
    needs: changes
    if: needs.changes.outputs.archive == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuses to publish without a signing key
        run: |
          out=$(GPGDIR=$(mktemp -d) bash -c '
            export GNUPGHOME="$GPGDIR"
            gpg --list-secret-keys >/dev/null 2>&1
            [ "${ALLOW_THROWAWAY_KEY:-0}" = "1" ] || { echo "refused"; exit 1; }' 2>&1) || true
          [ "$out" = "refused" ] || { echo "::error::the signing-key guard did not fire"; exit 1; }
          grep -q 'ALLOW_THROWAWAY_KEY' packaging/archive/publish_archives.sh \
            || { echo "::error::guard missing from publish_archives.sh"; exit 1; }
          grep -q 'EXPECTED_KEY_FPR' packaging/archive/publish_archives.sh \
            || { echo "::error::fingerprint check missing"; exit 1; }
