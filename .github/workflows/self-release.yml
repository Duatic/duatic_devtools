name: Self-release
# Releases this repository through the ci-workflows changelog release workflows: a dispatch opens
# the release pull request, and its merge tags v<version> and moves v<major>.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the bump derived from the commits'
        type: choice
        options: [derived, major, minor, patch]
        default: derived
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        type: string
  pull_request:
    types: [closed]

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    uses: Duatic/ci-workflows/.github/workflows/reusable_prepare_changelog_release.yml@v1
    with:
      bump: ${{ inputs.bump }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  tag:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged
    permissions:
      contents: write
    uses: Duatic/ci-workflows/.github/workflows/reusable_changelog_release_tag.yml@v1
