[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "duatic-devtools-hooks"
version = "0.1.0"
description = "Duatic pre-commit hooks (format-xacro / check-xacro and the shared linters)"
requires-python = ">=3.10"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
dev = ["pyyaml", "pre-commit"]

[tool.setuptools.packages.find]
where = ["pre-commit-hooks"]
include = ["duatic_xacro_hooks*"]
