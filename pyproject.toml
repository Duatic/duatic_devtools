[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# pre-commit installs a hook repository with `pip install .`, so the hooks exported in
# .pre-commit-hooks.yaml need this repository to be an installable (here: empty) package.
[project]
name = "duatic-devtools-hooks"
version = "0.1.0"
description = "Duatic pre-commit hooks (the shared linters)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pyyaml", "pre-commit"]

[tool.setuptools]
packages = []
